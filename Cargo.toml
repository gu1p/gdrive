[package]
name = "gdrive"
version = "4.0.0-alpha.1"
edition = "2021"
rust-version = "1.88"

[dependencies]
async-recursion = "1.2.0"
async-trait = "0.1.61"
base64 = "0.22.1"
bytes = "1.3.0"
chrono = { version = "0.4.41", default-features = false }
clap = { version = "4.5.41", features = ["derive"] }
clap_complete = "4.5.67"
# The terminal that the progress bars draw on (indicatif's own, already in the tree through it).
console = { version = "0.16.4", default-features = false, features = ["std"] }
# The CRC-32 of the entries of a zip file (`files unzip`), already a dependency of flate2.
crc32fast = "1.4.0"
error-trace = { version = "4.0.0", default-features = false }
# Full jitter for the retry backoff; already in the tree through tempfile.
fastrand = "2.1.0"
# Inflates the entries of a zip file (`files unzip`) as they stream by. Pure Rust: miniz_oxide, no C
# library.
flate2 = { version = "1.1.0", default-features = false, features = ["rust_backend"] }
futures = "0.3.25"
google-apis-common = { version = "8.0.0", default-features = false }
google-drive3 = "7.0.0"
home = "0.5.4"
human_bytes = { version = "0.4.3", default-features = false }
http-body-util = "0.1.5"
# Retry-After as an HTTP date; already in the tree through hyper.
httpdate = "1.0.2"
hyper = "1.5.2"
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1"] }
# client-proxy: the HTTP(S)_PROXY / ALL_PROXY / NO_PROXY matcher and the SOCKS5 connector (adds
# ipnet, for NO_PROXY address ranges).
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "client-proxy", "http1", "http2", "tokio"] }
# Progress bars on stderr (#12, #44): multi-line drawing, a refresh limit and `suspend`, so that
# the lines of a run print above the bars. Without default features: no wasm support.
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
md5 = "0.7.0"
mime = "0.3.16"
mime_guess = "2.0.4"
mktemp = "0.5.0"
pin-project-lite = "0.2.16"
ring = "0.17.14"
rustc_version_runtime = "0.2.1"
# Which temporary files a cancelled recursive download created: an open handle per file, compared
# by device and inode (Unix) or volume serial and file index (Windows). Tiny, no dependencies on
# Unix, winapi-util on Windows (already in the tree).
same-file = "1.0.6"
serde = { version = "1.0.151", features = ["derive"] }
serde_json = "1.0.89"
tabwriter = "1.2.1"
tar = "0.4.38"
tempfile = "3.3.0"
time = "0.3.7"
tokio = { version = "1.23.0", features = ["full"] }
# The `Service` trait of hyper's connectors, for the proxy connector (already a dependency of
# hyper-util).
tower-service = "0.3"
unicode-normalization = "0.1.24"
url = "2.5"
# service-account: ServiceAccountAuthenticator (JWT signed with ring) for `account add
# --service-account` and Application Default Credentials. The other default features stay off.
yup-oauth2 = { version = "12.1.2", default-features = false, features = ["service-account", "ring"] }

[dev-dependencies]
# The mock Google upload server in tests/ needs hyper's server side.
hyper = { version = "1.5.2", features = ["server", "http1"] }
# Paused clock for the retry and throttle tests.
tokio = { version = "1.23.0", features = ["test-util"] }

[lints.rust]
unreachable_pub = "warn"
dead_code_pub_in_binary = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# google-apis-common 8.0.0 lost the resumable-upload retry fixes that gdrive 3.9.1 shipped with
# (a retried chunk is skipped, a lost final reply is reported as an error). The vendored copy is
# 8.0.0 plus the patches described in vendor/google-apis-common/GDRIVE-PATCHES.md.
[patch.crates-io]
google-apis-common = { path = "vendor/google-apis-common" }
