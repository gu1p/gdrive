[package]
name = "gdrive"
version = "3.9.1"
edition = "2021"
rust-version = "1.88"

[dependencies]
async-recursion = "1.0.2"
bytes = "1.3.0"
chrono = { version = "0.4.41", default-features = false }
clap = { version = "4.5.41", features = ["derive"] }
error-trace = { version = "4.0.0", default-features = false }
exponential-backoff = "2.1.1"
futures = "0.3.25"
google-apis-common = { version = "8.0.0", default-features = false }
google-drive3 = "7.0.0"
home = "0.5.4"
human_bytes = { version = "0.4.3", default-features = false }
http-body-util = "0.1.5"
hyper = "1.5.2"
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
md5 = "0.7.0"
mime = "0.3.16"
mime_guess = "2.0.4"
mktemp = "0.5.0"
pin-project-lite = "0.2.16"
rustc_version_runtime = "0.2.1"
serde = { version = "1.0.151", features = ["derive"] }
serde_json = "1.0.89"
tabwriter = "1.2.1"
tar = "0.4.38"
tempfile = "3.3.0"
tokio = { version = "1.23.0", features = ["full"] }
yup-oauth2 = { version = "12.1.2", default-features = false }

[dev-dependencies]
# The mock Google upload server in tests/ needs hyper's server side.
hyper = { version = "1.5.2", features = ["server", "http1"] }

[lints.rust]
unreachable_pub = "warn"
dead_code_pub_in_binary = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# google-apis-common 8.0.0 lost the resumable-upload retry fixes that gdrive 3.9.1 shipped with
# (a retried chunk is skipped, a lost final reply is reported as an error). The vendored copy is
# 8.0.0 plus the patches described in vendor/google-apis-common/GDRIVE-PATCHES.md.
[patch.crates-io]
google-apis-common = { path = "vendor/google-apis-common" }
